[package]
name = "openidea-pdfviewer"
version = "0.1.2"
edition = "2024"
publish = false

# A plugin is its own workspace: it builds for wasm32-wasip2 on its own.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK of the OpenIDEA release this plugin is built against.
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.44" }
# The page speaks text; the bytes of a PDF read in place go out base64.
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
