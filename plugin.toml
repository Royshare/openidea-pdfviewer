id = "myrrr.pdfviewer"
name = "PDF Viewer"
version = "0.1.1"
description = "Embedded PDF reader for OpenIDEA 0.1.44+ (Plugin API 1.7+). OpenIDEA's system-associated app opener handles PDFs first; this viewer remains available as a custom-editor fallback."
authors = ["MyRRR"]
license = "Apache-2.0"
change-notes = "0.1.1 — Build against OpenIDEA 0.1.44 / Plugin API 1.7. OpenIDEA's associated-app opener handles PDFs before contributed editors, leaving this reader as a fallback."
categories = ["tools"]
icon = "assets/icon.svg"
# Built against OpenIDEA 0.1.44's Plugin API 1.7.
engines.openidea = "^1.7"

# Built by ./build.sh. The code is loaded when the editor is shown.
wasm = "dist/plugin.wasm"
activation = ["on-view:viewer"]

# No path-wide fs.read grant. The page's API 1.5 document.bytes() path needs
# no plugin capability; project.read is optional for the code-side fallback.
[capabilities]
optional = ["project.read"]

[[contributes.customEditors]]
id = "viewer"
title = "PDF"
patterns = ["*.pdf"]
priority = "default"
layout = "tab"
web = "web/index.html"
