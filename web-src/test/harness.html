<!doctype html>
<!--
  Loads the viewer the way OpenIDEA does: a sandboxed frame (opaque origin, no
  storage, no network) whose scripts may not start a Worker from the page's
  own URL. test/smoke.mjs drives this page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDF Viewer test harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1f22;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe id="viewer" sandbox="allow-scripts" src="/web/index.html"></iframe>
  </body>
</html>
