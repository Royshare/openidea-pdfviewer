<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PDF</title>
    <!-- Relative URLs only: the IDE serves this page from the plugin package. -->
    <link rel="stylesheet" href="./viewer.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar" role="toolbar" aria-label="PDF viewer"></header>
      <div id="main">
        <aside id="sidebar" hidden aria-label="Document outline"></aside>
        <div id="stage">
          <!-- pdf.js wants `container` absolutely positioned, `viewer` its own div. -->
          <div id="viewer-container" tabindex="0"><div id="viewer" class="pdfViewer"></div></div>
          <div id="overlay" hidden></div>
        </div>
      </div>
      <footer id="status" aria-live="polite"></footer>
    </div>
    <script type="module" src="./viewer.js"></script>
  </body>
</html>
